# WiFi, MQTT, OTA, time, logging
logger:

ota:
  - platform: esphome
    password: !secret home_dashboard_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fast connect: no network scan, no DHCP request
  fast_connect: true
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway}
    subnet: 255.255.255.0
    dns1: ${gateway}
  on_connect:
    - lambda: 'id(g_t_wifi) = millis();'
    # connect MQTT right away; on a normal start the client waits a fixed 5 s
    - mqtt.enable:

mqtt:
  broker: ${broker}
  topic_prefix: esphome
  # Without the native API, logs go via MQTT (INFO and above)
  log_topic:
    topic: esphome/${name}/log
    level: INFO
    retain: false   # otherwise a new subscriber gets the last, old line first
  discovery: false
  enable_on_boot: false   # enabled in wifi.on_connect
  idf_send_async: true    # does not block the main loop, costs some RAM
  reboot_timeout: 5min
  birth_message:
    topic: birth_message
    payload: 'esphome connected'
    qos: 0
    retain: true
  will_message:
    topic: will_message
    payload: 'esphome disconnected'
    qos: 0
    retain: true
  shutdown_message:
    topic: shutdown_message
    payload: 'esphome shutting down'
    qos: 0
    retain: true
  on_connect:
    - lambda: 'id(g_t_mqtt) = millis();'
  on_message:
    # Maintenance mode from Node-RED ("Wartung an"/"Wartung aus" = maintenance on/off, retained): stay awake for OTA
    - topic: esphome/maintenance
      then:
        - lambda: 'id(g_maint) = (x == "on" || x == "1" || x == "true");'
        - if:
            condition:
              lambda: 'return id(g_maint);'
            then:
              - deep_sleep.prevent: deep_sleep_ctrl
              - logger.log:
                  level: INFO
                  format: "Maintenance mode on: staying awake"
            else:
              - deep_sleep.allow: deep_sleep_ctrl
  on_json_message:
    # Everything for the display from Node-RED ("Display-Modell", esphome/display, v1)
    - topic: esphome/display
      then:
        - lambda: |-
            if (!dash::parse_model(x, dash::M)) {
              ESP_LOGW("display", "Unknown model version");
              return;
            }
            dash::apply_wind(dash::M);
            ESP_LOGD("mqtt_in", "Model: power %d W, %d open, forecast %d",
                     dash::M.power, dash::M.ct_open, (int) dash::M.fc.size());

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - ${gateway}
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# Reason of the last restart (via MQTT, retained)
debug:
  update_interval: never

text_sensor:
  - platform: debug
    reset_reason:
      id: reset_reason
      name: "Reset Reason"
