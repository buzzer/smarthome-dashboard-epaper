# Deep sleep cycle: connect, receive the model, draw only on change, sleep according to the wake schedule
globals:
  - id: g_t_wifi                # ms from boot until WiFi connected
    type: uint32_t
    initial_value: '0'
  - id: g_t_mqtt                # ms from boot until MQTT connected
    type: uint32_t
    initial_value: '0'
  - id: g_maint                 # maintenance mode active
    type: bool
    initial_value: 'false'
  - id: g_need_draw
    type: bool
    initial_value: 'false'
  - id: g_sleep_s               # computed sleep duration in seconds
    type: uint32_t
    initial_value: '600'

# triggered only via wake_cycle, never automatically
deep_sleep:
  id: deep_sleep_ctrl

script:
  - id: wake_cycle
    mode: single
    then:
      - wait_until:
          condition:
            mqtt.connected:
          timeout: 20s
      - wait_until:
          condition:
            lambda: 'return dash::M.valid;'
          timeout: 5s
      # remaining retained messages (e.g. maintenance)
      - delay: 1s
      - wait_until:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          # only waits after a cold boot (deep sleep keeps the time); SNTP is restarted on connect
          timeout: 15s
      # Maintenance mode: stay awake and draw every minute until "Wartung aus" (maintenance off) arrives
      - while:
          condition:
            lambda: 'return id(g_maint);'
          then:
            - lambda: 'if (dash::before_maintenance_draw != nullptr) dash::before_maintenance_draw();'
            - component.update: eink_display
            - delay: 60s
      - lambda: |-
          if (!dash::M.valid) {
            // no data (WiFi or broker down): keep the old image
            id(g_need_draw) = false;
            ESP_LOGW("cycle", "No values received, keeping image");
            return;
          }
          auto now = id(sntp_time).now();
          const int today = now.is_valid() ? now.year * 10000 + now.month * 100 + now.day_of_month : 0;
          const auto r = dash::changes(dash::M, today);
          id(g_need_draw) = r.redraw;
          ESP_LOGI("cycle", "WiFi after %u ms, MQTT after %u ms, values after %u ms, battery %.3f V%s",
                   (unsigned) id(g_t_wifi), (unsigned) id(g_t_mqtt), (unsigned) millis(), dash::M.vbat,
                   dash::M.batt_low ? " (low)" : "");
          ESP_LOGI("cycle", "%s", r.redraw ? "redraw" : "unchanged, no redraw");
          if (!r.changed.empty()) ESP_LOGI("cycle", "Changed: %s", r.changed.c_str());
          if (!r.tolerance.empty()) ESP_LOGI("cycle", "Tolerance exceeded: %s", r.tolerance.c_str());
      - if:
          condition:
            lambda: 'return id(g_need_draw);'
          then:
            - component.update: eink_display
      # Sleep duration according to the wake schedule
      - lambda: |-
          const auto &m = dash::M;
          int mins = ${wake_home_min};                                   // at home
          if (m.away || m.holiday) mins = ${wake_away_min};              // away, holiday
          if (m.pr_active || !m.scene.empty()) mins = ${wake_active_min};  // print or scene running
          uint32_t secs = mins * 60;
          auto now = id(sntp_time).now();
          if (now.is_valid() && !m.pr_active) {
            const int t = now.hour * 3600 + now.minute * 60 + now.second;
            if (now.hour >= ${night_from}) secs = 24 * 3600 - t + ${night_to} * 3600;  // night pause
            else if (now.hour < ${night_to}) secs = ${night_to} * 3600 - t;
          }
          if (secs < 60) secs = 60;
          id(g_sleep_s) = secs;
          ESP_LOGI("cycle", "Sleeping %u s (awake for %u ms)", (unsigned) secs, (unsigned) millis());
      - switch.turn_off: epd_power
      - deep_sleep.enter:
          id: deep_sleep_ctrl
          sleep_duration: !lambda 'return id(g_sleep_s) * 1000;'
