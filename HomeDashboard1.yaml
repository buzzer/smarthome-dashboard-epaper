# Home display: 7.5" e-paper fed by Node-RED ("Display-Modell" -> esphome/display)
# Layout: packages in packages/, data model, rendering and change detection as C++ in display/
substitutions:
  name: home-dashboard-1
  static_ip: 192.168.66.70
  gateway: 192.168.66.1
  broker: 192.168.66.99
  # Wake schedule in minutes; night pause from night_from to night_to o'clock (except while printing)
  wake_home_min: "10"
  wake_away_min: "30"
  wake_active_min: "5"
  night_from: "23"
  night_to: "6"
  # Battery thresholds without a voltage divider on GPIO33 (interim, measured on this board): the ADC then
  # reads the supply it runs from, saturates at ~3.13 and below ~2.9 V reads ~0.4 V too high.
  # 3.12 = ~2.86 V, 3.07 = ~2.75 V real. With a 1:2 divider remove these three lines; the defaults in
  # packages/battery.yaml (3.05 / 3.10 / 2.90 V) then apply to the real voltage.
  batt_low_v: "3.12"
  batt_ok_v: "3.125"
  batt_empty_v: "3.07"

packages:
  board: !include packages/board_waveshare.yaml
  # Display driver, choose one:
  # display_gray.yaml: 4 gray levels, uses components/epaper_gray (GPL-3.0)
  # display_bw.yaml:   black and white with ESPHome's standard driver, no GPL file from this project
  display: !include packages/display_gray.yaml
  network: !include packages/network.yaml
  fonts: !include packages/fonts.yaml
  # battery voltage on GPIO33; remove if GPIO33 is not wired to the supply
  battery: !include packages/battery.yaml
  cycle: !include packages/cycle.yaml

esphome:
  name: ${name}
  includes:
    - system/sntp.h
    - display/model.h
    - display/parse.h
    - display/rtc_state.h
    - display/change.h
    - display/wind.h
    - display/render.h
  # a list, so that packages can add their own on_boot entries (packages/battery.yaml)
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              lambda: 'return !dash::M.batt_empty;'
            then:
              - script.execute: wake_cycle
